pointcloud_to_laserscan:
  ros__parameters:
    use_sim_time: true
    target_frame: base_link
    transform_tolerance: 0.01
    min_height: -0.2
    max_height: 3.0
    angle_min: -3.14
    angle_max: 3.14
    angle_increment: 0.007
    scan_time: 0.2
    range_min: 0.7
    range_max: 10.0
    use_inf: true
    inf_epsilon: 1.0
    concurrency_level: 1
